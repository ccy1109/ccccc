<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 聊天空間</title>
    <style>
        :root { --main-blue: #a2d2ff; --bg-white: #ffffff; --msg-user: #e1eefb; --msg-npc: #f0f7ff; }
        body { margin: 0; background-color: var(--bg-white); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 頂部導覽列 */
        #header { background: white; padding: 10px 15px; border-bottom: 2px solid var(--main-blue); display: flex; justify-content: space-between; align-items: center; }
        #settings-btn { background: var(--main-blue); color: white; padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; cursor: pointer; }
        
        /* 對話區域 */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 18px; font-size: 1rem; line-height: 1.5; }
        .npc { align-self: flex-start; background: var(--msg-npc); border: 1px solid var(--main-blue); border-bottom-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--main-blue); color: white; border-bottom-right-radius: 2px; }
        
        /* 字體格式 */
        b { font-weight: 800; color: #333; }
        i { font-style: italic; color: #888; font-size: 0.9rem; }

        /* 心裡話 */
        #thought-bubble { cursor: pointer; background: #fff9db; border: 1px solid #fab005; padding: 8px; border-radius: 15px; font-size: 0.8rem; display: none; align-self: flex-start; margin-top: 5px; color: #856404; }

        /* 輸入區域 */
        #input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; }
        input { flex: 1; padding: 12px; border: 1.5px solid #eee; border-radius: 25px; font-size: 16px; outline: none; }
        #send-btn { background: var(--main-blue); color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; }

        /* 設定視窗 */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-body { background: white; width: 85%; padding: 20px; border-radius: 15px; max-height: 80%; overflow-y: auto; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        input[type="text"], textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="header">
    <div><strong id="npc-name-display">載入中</strong> <span id="rel-tag" style="font-size: 0.7rem; background: #eee; padding: 2px 5px; border-radius: 5px;">普通朋友</span></div>
    <div id="settings-btn" onclick="openSettings()">角色設定</div>
</div>

<div id="chat-box">
    <div class="msg npc"><i>（夕陽灑在休息室的沙發上，他抬起頭看著妳）</i><br><b>「妳來啦？今天的課還順利嗎？聽說妳最近在研究《反對完美》，很有趣的主題呢。」</b></div>
    <div id="thought-bubble" onclick="alert(this.dataset.content)">💡 點擊查看心裡話</div>
</div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="對他說點什麼..." autocomplete="off">
    <button id="send-btn" onclick="sendMsg()">傳送</button>
</div>

<div id="modal">
    <div class="modal-body">
        <h3>角色設定中心</h3>
        <label>角色名稱</label><input type="text" id="cfg-name">
        <label>角色性格</label><textarea id="cfg-personality" rows="2"></textarea>
        <label>外觀描述</label><textarea id="cfg-look" rows="2"></textarea>
        <label>說話方式</label><textarea id="cfg-style" rows="2"></textarea>
        <button onclick="saveSettings()" style="width:100%; margin-top:20px; padding:10px; background:var(--main-blue); color:white; border:none; border-radius:10px;">儲存並返回</button>
    </div>
</div>

<script>
    let love = parseInt(localStorage.getItem('rp_love_final')) || 0;
    let config = JSON.parse(localStorage.getItem('rp_cfg_final')) || {
        name: "阿信",
        personality: "溫柔內斂、偶爾會因為害羞而顯得被動",
        look: "黑色連帽衫，眼神裡總是帶著笑意",
        style: "語氣平緩，常用括號表達細微的動作"
    };

    function init() {
        document.getElementById('npc-name-display').innerText = config.name;
        document.getElementById('cfg-name').value = config.name;
        document.getElementById('cfg-personality').value = config.personality;
        document.getElementById('cfg-look').value = config.look;
        document.getElementById('cfg-style').value = config.style;
        updateUI();
    }

    function updateUI() {
        let tag = love > 300 ? "熱戀中" : (love > 100 ? "曖昧中" : "普通朋友");
        document.getElementById('rel-tag').innerText = tag;
        localStorage.setItem('rp_love_final', love);
        localStorage.setItem('rp_cfg_final', JSON.stringify(config));
    }

    function sendMsg() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'user');
        input.value = '';
        love += 5;
        updateUI();

        setTimeout(() => {
            const replies = [
                `<i>（${config.name}輕輕笑了笑，放下了手中的樂譜）</i><br><b>「去年的 6 場演唱會我有看到妳喔，謝謝妳一直都在。」</b>`,
                `<i>（他若有所思地看著妳）</i><br><b>「妳的狗狗最近還好嗎？要注意牠的腸胃喔。」</b>`,
                `<b>「雖然我不太主動，但其實我一直在等妳的訊息。」</b>`
            ];
            const thoughts = ["（她怎麼能這麼了解我...）", "（好想再靠近一點點。）", "（健康事業管理...聽起來是很辛苦的專業呢。）"];
            const idx = Math.floor(Math.random() * replies.length);
            addMsg(replies[idx], 'npc');
            const bubble = document.getElementById('thought-bubble');
            bubble.style.display = 'block';
            bubble.dataset.content = thoughts[idx];
        }, 1000);
    }

    function addMsg(html, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerHTML = html;
        document.getElementById('chat-box').appendChild(div);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    }

    function openSettings() { document.getElementById('modal').style.display = 'flex'; }
    function saveSettings() {
        config.name = document.getElementById('cfg-name').value;
        config.personality = document.getElementById('cfg-personality').value;
        config.look = document.getElementById('cfg-look').value;
        config.style = document.getElementById('cfg-style').value;
        document.getElementById('npc-name-display').innerText = config.name;
        document.getElementById('modal').style.display = 'none';
        updateUI();
    }

    init();
</script>
</body>
</html>
