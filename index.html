<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 互動空間 - 長期記憶版</title>
    <style>
        :root { --main-blue: #a2d2ff; --bg-white: #ffffff; --msg-user: #e1eefb; --msg-npc: #f0f7ff; }
        body { margin: 0; background-color: var(--bg-white); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: fixed; width: 100%; }
        #header { background: white; padding: 15px; border-bottom: 2px solid var(--main-blue); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fff; padding-bottom: 100px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 18px; font-size: 1rem; line-height: 1.5; white-space: pre-wrap; }
        .npc { align-self: flex-start; background: var(--msg-npc); border: 1px solid var(--main-blue); border-bottom-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--main-blue); color: white; border-bottom-right-radius: 2px; }
        .narration { font-style: italic; color: #888; font-size: 0.9rem; display: block; margin-bottom: 5px; }
        #input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; position: absolute; bottom: 0; width: 100%; box-sizing: border-box; z-index: 10; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        input { flex: 1; padding: 12px; border: 1.5px solid #eee; border-radius: 25px; outline: none; font-size: 16px; }
        #send-btn { background: var(--main-blue); color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        
        #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 85%; max-height: 80%; overflow-y: auto; }
        .modal-content textarea { width: 100%; margin: 8px 0; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="header">
    <div><strong id="display-name">載入中...</strong> <span id="relation-tag" style="font-size: 0.7rem; background: #a2d2ff; color: white; padding: 2px 8px; border-radius: 10px;">朋友</span></div>
    <div onclick="toggleSettings()" style="cursor:pointer; font-size: 1.4rem;">⚙️</div>
</div>

<div id="chat-box" id="chat-content">
    </div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="對他說話..." autocomplete="off">
    <button id="send-btn" type="button">傳送</button>
</div>

<div id="settings-modal">
    <div class="modal-content">
        <h3>✨ 角色設定與記憶</h3>
        <label>名稱：</label><input type="text" id="set-name" style="width:100%; padding:8px; margin:5px 0; border:1px solid #ddd; border-radius:8px;">
        <label>性格：</label><textarea id="set-personality" rows="2"></textarea>
        <label><b>🧠 長期記憶（他會記得的事）：</b></label>
        <textarea id="set-memory" rows="4" placeholder="例如：我們在12月看了6場演唱會、我養了一隻老狗、我正在讀健康事業管理..."></textarea>
        <button onclick="saveSettings()" style="width:100%; background:var(--main-blue); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; margin-top:10px;">儲存並同步記憶</button>
        <button onclick="clearChat()" style="width:100%; background:#ff85a1; color:white; border:none; padding:8px; border-radius:10px; margin-top:10px; font-size:0.8rem;">清空對話紀錄</button>
    </div>
</div>

<script>
    let love = parseInt(localStorage.getItem('rp_love_v4')) || 0;
    let chatHistory = JSON.parse(localStorage.getItem('rp_history_v4')) || [];
    let config = JSON.parse(localStorage.getItem('rp_config_v4')) || { 
        name: "阿信", 
        personality: "溫柔內斂", 
        memory: "妳去年12月看了我6場演唱會，妳養了一隻老狗，妳在學健康事業管理。" 
    };

    function init() {
        document.getElementById('display-name').innerText = config.name;
        document.getElementById('set-name').value = config.name;
        document.getElementById('set-personality').value = config.personality;
        document.getElementById('set-memory').value = config.memory;
        
        // 加載歷史對話
        if (chatHistory.length === 0) {
            addMsg(`<span class="narration">（他看著妳，眼神裡帶著一絲暖意）</span><b>「妳來了。今天過得好嗎？」</b>`, 'npc', false);
        } else {
            chatHistory.forEach(item => addMsg(item.txt, item.sender, false));
        }
        updateUI();
    }

    function updateUI() {
        let tag = "普通朋友";
        if (love >= 500) tag = "熱戀中";
        else if (love >= 150) tag = "曖昧中";
        document.getElementById('relation-tag').innerText = tag;
        localStorage.setItem('rp_love_v4', love);
        localStorage.setItem('rp_config_v4', JSON.stringify(config));
        localStorage.setItem('rp_history_v4', JSON.stringify(chatHistory));
    }

    const sendBtn = document.getElementById('send-btn');
    const userInput = document.getElementById('user-input');

    sendBtn.addEventListener('click', sendMsg);
    userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMsg(); });

    function sendMsg() {
        const text = userInput.value.trim();
        if (!text) return;

        addMsg(text, 'user');
        userInput.value = '';
        love += 3;
        
        // 模擬 AI 根據記憶回覆
        setTimeout(() => {
            const replies = [
                `<span class="narration">（他輕輕點頭，像是想起了什麼）</span><b>「我記得妳說過妳很重視身邊的夥伴，就像妳對那隻老狗一樣細心。」</b>`,
                `<b>「健康事業管理聽起來很專業，如果太累了，記得我的音樂永遠陪著妳。」</b>`,
                `<span class="narration">（他笑了笑，語氣溫柔）</span><b>「12月的演唱會妳能來那麼多場，其實我心裡真的很感動。」</b>`
            ];
            
            const randomReply = replies[Math.floor(Math.random() * replies.length)];
            addMsg(randomReply, 'npc');
        }, 1000);
    }

    function addMsg(txt, sender, save = true) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerHTML = txt.replace(/\n/g, '<br>');
        document.getElementById('chat-box').appendChild(div);
        document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        
        if (save) {
            chatHistory.push({ txt, sender });
            updateUI();
        }
    }

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    function saveSettings() {
        config.name = document.getElementById('set-name').value;
        config.personality = document.getElementById('set-personality').value;
        config.memory = document.getElementById('set-memory').value;
        document.getElementById('display-name').innerText = config.name;
        toggleSettings();
        updateUI();
        alert("記憶已同步！下次對話他會更了解妳。");
    }

    function clearChat() {
        if(confirm("確定要清空所有對話記憶嗎？")) {
            chatHistory = [];
            localStorage.removeItem('rp_history_v4');
            location.reload();
        }
    }

    init();
</script>
</body>
</html>
