<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 沉浸式劇本空間</title>
    <style>
        :root { --pink-gradient: linear-gradient(90deg, #ff758c 0%, #ff7eb3 100%); --bg-gray: #fcfcfc; }
        body { margin: 0; background-color: var(--bg-gray); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* 頂部狀態欄 */
        #top-header { background: var(--pink-gradient); padding: 15px 20px; color: white; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        .header-info { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.9rem; }
        .progress-container { background: rgba(255, 255, 255, 0.3); height: 10px; border-radius: 5px; overflow: hidden; }
        #progress-bar { background: white; width: 10%; height: 100%; transition: width 0.6s ease; }

        /* 聊天顯示區 */
        #chat-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 150px; }
        .msg { max-width: 88%; padding: 18px; border-radius: 25px; font-size: 1rem; line-height: 1.8; word-wrap: break-word; }
        .npc { align-self: flex-start; background: white; border: 1px solid #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
        .user { align-self: flex-end; background: var(--pink-gradient); color: white; border-bottom-right-radius: 4px; }
        
        /* 格式化 */
        b { font-weight: 800; color: #000; } 
        i { font-style: italic; color: #666; font-size: 0.95rem; display: block; border-left: 3px solid #ffccd5; padding-left: 10px; margin-bottom: 12px; }

        /* 輸入區域 */
        #input-dock { background: white; padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; z-index: 200; }
        input { flex: 1; padding: 12px 20px; border: 1.5px solid #f0f0f0; border-radius: 30px; font-size: 16px; outline: none; }
        #send-action { background: var(--pink-gradient); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        /* 設定按鈕與彈窗 */
        #set-btn { position: fixed; right: 20px; bottom: 90px; background: white; border: 1.5px solid #ff758c; color: #ff758c; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 150; }
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 300; justify-content: center; align-items: center; }
        .modal-view { background: white; width: 90%; padding: 25px; border-radius: 25px; max-height: 85%; overflow-y: auto; }
        textarea, input[type="text"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="top-header">
    <div class="header-info">
        <span>💖 關係：<span id="relation-status">初識</span></span>
        <span>好感度 <span id="love-val">10</span>%</span>
    </div>
    <div class="progress-container"><div id="progress-bar"></div></div>
</div>

<div id="chat-content">
    <div class="msg npc"><i>（系統提示：請點擊右下角⚙️設定 API Key 與角色性格，讓故事開始運轉。）</i><b>「我正在等妳為我設定靈魂...」</b></div>
</div>

<div id="set-btn" onclick="openSettings()">⚙️</div>

<div id="input-dock">
    <input type="text" id="user-words" placeholder="輸入訊息...">
    <button id="send-action" onclick="handleSend()">➤</button>
</div>

<div id="modal-overlay">
    <div class="modal-view">
        <h3 style="color:#ff758c; text-align:center;">✨ 角色大腦設定</h3>
        <label>1. Gemini API Key (必要)</label>
        <input type="text" id="api-key" placeholder="貼上妳的 API Key">
        <label>2. 角色姓名</label><input type="text" id="in-name">
        <label>3. 性格與內心</label><textarea id="in-pers" rows="3" placeholder="例如：性格冷淡但對妳有強烈佔有欲，外冷內熱"></textarea>
        <label>4. 說話方式</label><textarea id="in-style" rows="3" placeholder="例如：優雅但帶著侵略性，說話前會先觀察妳，字數請維持在300字以上"></textarea>
        <button onclick="saveAll()" style="width:100%; margin-top:20px; padding:15px; background:var(--pink-gradient); color:white; border:none; border-radius:15px; font-weight:bold;">啟動靈魂</button>
    </div>
</div>

<script>
    let lovePts = parseInt(localStorage.getItem('pts_v8')) || 10;
    let cfg = JSON.parse(localStorage.getItem('cfg_v8')) || { name: "角色", apiKey: "" };
    let chatHistory = [];

    function start() {
        document.getElementById('api-key').value = cfg.apiKey || "";
        document.getElementById('in-name').value = cfg.name || "";
        refreshUI();
    }

    function refreshUI() {
        document.getElementById('love-val').innerText = lovePts;
        document.getElementById('progress-bar').style.width = (lovePts % 100) + "%";
        document.getElementById('relation-status').innerText = lovePts > 300 ? "熱戀中" : "初識";
        localStorage.setItem('pts_v8', lovePts);
        localStorage.setItem('cfg_v8', JSON.stringify(cfg));
    }

    async function handleSend() {
        const inp = document.getElementById('user-words');
        const text = inp.value.trim();
        if (!text || !cfg.apiKey) return;

        displayMsg(text, 'user');
        inp.value = '';
        chatHistory.push({ role: "user", parts: [{ text: text }] });

        const loadingMsg = document.createElement('div');
        loadingMsg.className = "msg npc";
        loadingMsg.innerText = "對方正在思考中...";
        document.getElementById('chat-content').appendChild(loadingMsg);

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${cfg.apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: chatHistory,
                    systemInstruction: { parts: [{ text: `妳現在要扮演角色：${cfg.name}。性格是：${cfg.pers}。說話方式是：${cfg.style}。請注意：1. 每次回覆字數必須超過300字。2. 內容必須包含細膩的環境描述(i標籤)與內心獨白，對話請加粗(b標籤)。3. 請根據使用者的話給予連貫的回應，維持故事性。` }] }
                })
            });
            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            loadingMsg.remove();
            displayMsg(aiText, 'npc');
            chatHistory.push({ role: "model", parts: [{ text: aiText }] });
            lovePts += 5;
            refreshUI();
        } catch (e) {
            loadingMsg.innerText = "API Key 錯誤或連線失敗。";
        }
    }

    function displayMsg(content, side) {
        const d = document.createElement('div');
        d.className = `msg ${side}`;
        // 將 AI 回傳的 Markdown 轉換為 HTML 格式
        let formatted = content.replace(/\*(.*?)\*/g, "<i>$1</i>").replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
        d.innerHTML = formatted.replace(/\n/g, '<br>');
        document.getElementById('chat-content').appendChild(d);
        document.getElementById('chat-content').scrollTop = document.getElementById('chat-content').scrollHeight;
    }

    function openSettings() { document.getElementById('modal-overlay').style.display = 'flex'; }
    function saveAll() {
        cfg = {
            apiKey: document.getElementById('api-key').value,
            name: document.getElementById('in-name').value,
            pers: document.getElementById('in-pers').value,
            style: document.getElementById('in-style').value
        };
        document.getElementById('modal-overlay').style.display = 'none';
        refreshUI();
    }
    start();
</script>
</body>
</html>
